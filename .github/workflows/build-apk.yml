name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VER_STR}"
          if [ -z "${JAVA_VER_STR}" ]; then
            echo "ERROR: Unable to detect Java version string."
            exit 1
          fi

          MAJOR_VER=$(echo "${JAVA_VER_STR}" | awk -F '.' '{print $1}')
          echo "Detected Java major version: ${MAJOR_VER}"
          if ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version as an integer."
            exit 1
          fi

          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Java major version ${MAJOR_VER} is lower than required 17."
            exit 1
          fi
          echo "Java environment verified successfully: Version ${MAJOR_VER} >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore was not found after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at: ${EXPECTED_APK}"
            echo "Listing files found inside app/build/outputs/apk (if present):"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: Debug APK exists but is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: Expected APK does not end with .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK successfully: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "${TEMP_DIR}"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "${RAW_REPO_NAME}" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "${DEST_PATH}"

          if [ ! -f "${DEST_PATH}" ] || [ ! -s "${DEST_PATH}" ]; then
            echo "ERROR: Failed to prepare APK release asset at ${DEST_PATH}."
            exit 1
          fi

          echo "Prepared release asset: ${DEST_PATH}"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset is missing or empty at path '${ASSET_PATH}'."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset '${ASSET_PATH}' is not an .apk file."
              exit 1
              ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat <<'EOF'
          ### Debug APK Release
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Intended Use**: For testing and verification only
          - **Production Status**: Not a Google Play Store production release
          - **Signing**: Signed only with a temporary debug keystore

          Download the APK directly from the **Assets** section below.
          EOF
          )

          echo "Creating GitHub Release with tag: ${TAG}"
          gh release create "${TAG}" "${ASSET_PATH}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${TARGET_COMMIT}" \
            --latest

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "${TAG}"
            RELEASE_URL=$(gh release view "${TAG}" --json url -q .url || true)

            echo "Release Tag: ${TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset Name: ${ASSET_NAME}"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK build succeeded!**"
              echo ""
              echo "📦 **GitHub Release**: [${TAG}](${RELEASE_URL})"
              echo ""
              echo "📲 **Download**: You can download the installable APK (\`${ASSET_NAME}\`) directly from the **Assets** section on the [GitHub Release Page](${RELEASE_URL})."
              echo ""
              echo "🛡️ **Actions Artifact Backup**: The workflow artifact \`app-debug-apk\` is also stored under this run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            echo "=== Build & Artifact Backup Status ==="
            echo "The APK was successfully compiled and verified."
            echo "The workflow artifact named 'app-debug-apk' remains available for download."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK build succeeded!**"
              echo ""
              echo "⚠️ **GitHub Release publishing encountered an issue or was skipped.**"
              echo ""
              echo "📦 **Actions Artifact Available**: Download the debug APK directly from the **\`app-debug-apk\`** artifact attached to this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
